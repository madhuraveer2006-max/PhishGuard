
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PhishGuard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; }

        body {
            background: #f3f7fc;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(18,52,90,.09);
        }

        .brand {
            color: #12345a;
            font-weight: 800;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        .form-label {
            color: #26374a;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            padding: 12px;
            border-color: #dce4ef;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: #168bd2;
            box-shadow: 0 0 0 3px rgba(22,139,210,.12);
        }

        .password-btn {
            background: #f5f8fc;
            border-color: #dce4ef;
            color: #087fca;
            min-width: 48px;
        }

        .password-btn:hover {
            background: #e8f3fc;
            color: #0669a9;
        }

        .password-btn i { font-size: 18px; }

        .btn-main {
            background: #087fca;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
            border: none;
        }

        .btn-main:hover {
            background: #0669a9;
            color: white;
        }

        a {
            color: #087fca;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .auth-card { padding: 27px; }
        }
    </style>
</head>

<body>

<div class="auth-card">

    <h2 class="brand">PhishGuard</h2>
    <h4 class="text-center mt-3">Welcome Back</h4>
    <p class="subtitle text-center mb-4">
        Login to your account
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   autocomplete="email" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" name="password"
                       id="login_password"
                       class="form-control"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>

                <button type="button" class="btn password-btn"
                        onclick="togglePassword('login_password', this)"
                        aria-label="Show password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-main w-100">
            Login
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create Account</a>
    </p>

</div>

<script>
function togglePassword(id, button) {
    const field = document.getElementById(id);
    const icon = button.querySelector("i");

    if (field.type === "password") {
        field.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
        button.setAttribute("aria-label", "Hide password");
    } else {
        field.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
        button.setAttribute("aria-label", "Show password");
    }
}
</script>

</body>
</html>
